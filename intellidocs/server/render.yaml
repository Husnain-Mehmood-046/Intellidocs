# IntelliDocs Server - Render Configuration
#
# Why Render?
# - Free tier for web services (750 hours/month)
# - Automatic HTTPS, custom domains
# - GitHub integration with auto-deploy
# - Environment variable management
# - Persistent disks available (for file uploads if needed)
#
# Usage:
# 1. Connect GitHub repo to Render
# 2. Create new Web Service from this repo
# 3. Render will detect this render.yaml and configure automatically
# 4. Add environment variables in Render dashboard
#
# Required Environment Variables (set in Render dashboard):
# - MONGODB_URI: MongoDB Atlas connection string
# - AI_SERVICE_URL: https://your-modal-app.modal.run (or deployed AI service URL)
# - JWT_SECRET: Strong random string (shared with AI service)
# - NODE_ENV: production
# - PORT: 5000 (Render sets this automatically)

services:
  - type: web
    name: intellidocs-server
    runtime: node
    plan: free
    region: oregon  # or frankfurt, singapore
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # These must be set in Render dashboard (not committed):
      # - key: MONGODB_URI
      #   sync: false
      # - key: AI_SERVICE_URL
      #   sync: false
      # - key: JWT_SECRET
      #   sync: false
    # Optional: Persistent disk for file uploads
    # disk:
    #   name: intellidocs-server-disk
    #   mountPath: /app/uploads
    #   sizeGB: 1